server.port=8080
spring.application.name=auth-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/learn}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:learn}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:learn}
spring.jpa.hibernate.ddl-auto=none

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379

management.endpoints.web.exposure.include=health
